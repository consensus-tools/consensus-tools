<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skill Version Eval</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; font-weight: 600; color: #e6edf3; }
    h2 { font-size: 1.1rem; font-weight: 600; color: #e6edf3; margin-bottom: 12px; }
    h3 { font-size: 0.95rem; font-weight: 600; color: #e6edf3; }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

    header {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 24px; border-bottom: 1px solid #30363d;
      background: #161b22;
    }
    header .tag {
      font-size: 0.7rem; background: #388bfd22; color: #388bfd;
      padding: 2px 8px; border-radius: 12px; font-weight: 500;
    }

    /* Controls */
    .controls {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      padding: 20px; margin-bottom: 24px;
    }
    .control-row {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    }
    .control-group { display: flex; flex-direction: column; gap: 4px; }
    .control-group label {
      font-size: 0.75rem; color: #8b949e; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    select, button {
      background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
      border-radius: 6px; padding: 8px 12px; font-size: 0.85rem;
      min-width: 160px; cursor: pointer;
    }
    select:focus, button:focus { outline: none; border-color: #388bfd; }
    optgroup { color: #8b949e; font-style: normal; }
    option { color: #c9d1d9; }

    .btn-run {
      background: #238636; border-color: #238636; color: #fff;
      font-weight: 600; min-width: 120px; transition: background 0.15s;
    }
    .btn-run:hover:not(:disabled) { background: #2ea043; }
    .btn-run:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-text {
      font-size: 0.8rem; color: #8b949e; align-self: center; min-width: 200px;
    }
    .status-text.error { color: #f85149; }

    /* Results */
    .results-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .result-count { font-size: 0.8rem; color: #8b949e; }

    .card {
      background: #161b22; border: 1px solid #30363d; border-radius: 8px;
      margin-bottom: 16px; overflow: hidden;
    }
    .card-header {
      display: flex; align-items: center; gap: 10px; padding: 14px 18px;
      cursor: pointer; user-select: none; flex-wrap: wrap;
    }
    .card-header:hover { background: #1c2129; }
    .card-header .arrow {
      font-size: 0.7rem; color: #8b949e; transition: transform 0.2s;
      margin-right: 4px;
    }
    .card.open .card-header .arrow { transform: rotate(90deg); }
    .card-header .skill-name { font-weight: 600; color: #e6edf3; }
    .card-header .versions { font-size: 0.8rem; color: #8b949e; }
    .card-header .model-tag {
      font-size: 0.7rem; padding: 2px 8px; border-radius: 12px;
      background: #30363d; color: #8b949e;
    }

    .badge {
      font-size: 0.7rem; font-weight: 600; padding: 2px 10px;
      border-radius: 12px; text-transform: uppercase; letter-spacing: 0.3px;
    }
    .badge-allow { background: #23863622; color: #238636; }
    .badge-block { background: #da363322; color: #da3633; }
    .badge-rewrite { background: #d2992222; color: #d29922; }
    .badge-human { background: #8957e522; color: #8957e5; }
    .badge-agree { background: #23863622; color: #3fb950; }
    .badge-disagree { background: #da363322; color: #f85149; }
    .badge-single { background: #388bfd22; color: #388bfd; }
    .badge-consensus { background: #a371f722; color: #a371f7; }

    .badge-yes { background: #23863622; color: #3fb950; }
    .badge-no { background: #da363322; color: #f85149; }

    .card-body { display: none; padding: 0 18px 18px; }
    .card.open .card-body { display: block; }

    /* Diff preview */
    .diff-preview {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 12px; font-family: "SF Mono", Monaco, monospace; font-size: 0.75rem;
      line-height: 1.6; max-height: 440px; overflow-y: auto; margin-bottom: 16px;
      white-space: pre-wrap; word-break: break-word;
    }
    .diff-add { color: #3fb950; }
    .diff-del { color: #f85149; }
    .diff-ctx { color: #8b949e; }

    /* Side by side */
    .panels {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: #0d1117; border: 1px solid #30363d; border-radius: 6px;
      padding: 14px;
    }
    .panel-header {
      display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .panel-stat {
      font-size: 0.75rem; color: #8b949e;
    }
    .panel-stat span { color: #e6edf3; font-weight: 500; }

    .vote-row {
      display: flex; align-items: center; gap: 8px; padding: 6px 0;
      border-top: 1px solid #21262d; font-size: 0.8rem;
    }
    .vote-row:first-child { border-top: none; }
    .vote-name { font-weight: 500; color: #e6edf3; min-width: 120px; }
    .vote-risk { color: #8b949e; font-size: 0.75rem; }
    .vote-reason { color: #8b949e; font-size: 0.75rem; flex: 1; }

    .empty-state {
      text-align: center; padding: 60px 20px; color: #484f58;
    }
    .empty-state h3 { color: #484f58; margin-bottom: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>Skill Version Eval</h1>
    <span class="tag">consensus-tools</span>
  </header>

  <div class="container">
    <div class="controls">
      <div class="control-row">
        <div class="control-group">
          <label>Repo</label>
          <select id="repoSelect"><option value="">Loading...</option></select>
        </div>
        <div class="control-group">
          <label>Skill</label>
          <select id="skillSelect"><option value="">Select repo first</option></select>
        </div>
        <div class="control-group">
          <label>Version A</label>
          <select id="versionASelect"><option value="">Select repo first</option></select>
        </div>
        <div class="control-group">
          <label>Version B</label>
          <select id="versionBSelect"><option value="">Select repo first</option></select>
        </div>
        <div class="control-group">
          <label>Model</label>
          <select id="modelSelect">
            <option value="claude-sonnet-4-6">claude-sonnet-4-6</option>
            <option value="gpt-5-mini">gpt-5-mini</option>
          </select>
        </div>
        <div class="control-group">
          <label>&nbsp;</label>
          <button class="btn-run" id="runBtn">Run Eval</button>
        </div>
        <div class="status-text" id="statusText"></div>
      </div>
    </div>

    <div class="results-header">
      <h2>Results</h2>
      <span class="result-count" id="resultCount"></span>
    </div>
    <div id="resultsContainer">
      <div class="empty-state">
        <h3>No results yet</h3>
        <p>Select versions and run an eval to get started.</p>
      </div>
    </div>
  </div>

  <script>
    const $ = (sel) => document.querySelector(sel);
    const repoSelect = $("#repoSelect");
    const skillSelect = $("#skillSelect");
    const versionASelect = $("#versionASelect");
    const versionBSelect = $("#versionBSelect");
    const modelSelect = $("#modelSelect");
    const runBtn = $("#runBtn");
    const statusText = $("#statusText");
    const resultsContainer = $("#resultsContainer");
    const resultCount = $("#resultCount");

    let repos = [];
    let runs = [];

    async function fetchJSON(url, opts) {
      const res = await fetch(url, opts);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || `HTTP ${res.status}`);
      }
      return res.json();
    }

    async function loadRepos() {
      try {
        repos = await fetchJSON("/api/repos");
        repoSelect.innerHTML = repos.map(r =>
          `<option value="${r.label}" data-owner="${r.owner}" data-repo="${r.repo}">${r.label}</option>`
        ).join("");
        if (repos.length) onRepoChange();
      } catch (e) {
        repoSelect.innerHTML = `<option value="">Error loading repos</option>`;
      }
    }

    async function onRepoChange() {
      const label = repoSelect.value;
      const repo = repos.find(r => r.label === label);
      if (!repo) return;

      // Load skills
      try {
        const skills = await fetchJSON(`/api/skills?repo=${label}`);
        skillSelect.innerHTML = skills.map(s => `<option value="${s}">${s}</option>`).join("");
      } catch {
        skillSelect.innerHTML = `<option value="">Error</option>`;
      }

      // Load versions
      try {
        const versions = await fetchJSON(`/api/versions?owner=${repo.owner}&repo=${repo.repo}`);
        const buildOpts = (v) => {
          let html = "";
          if (v.branches.length) {
            html += `<optgroup label="Branches">`;
            html += v.branches.map(b => `<option value="${b}">${b}</option>`).join("");
            html += `</optgroup>`;
          }
          if (v.tags.length) {
            html += `<optgroup label="Tags">`;
            html += v.tags.map(t => `<option value="${t}">${t}</option>`).join("");
            html += `</optgroup>`;
          }
          return html || `<option value="">No versions found</option>`;
        };
        versionASelect.innerHTML = buildOpts(versions);
        versionBSelect.innerHTML = buildOpts(versions);
        // Default version B to second option if available
        if (versionBSelect.options.length > 1) {
          versionBSelect.selectedIndex = 1;
        }
      } catch {
        versionASelect.innerHTML = `<option value="">Error</option>`;
        versionBSelect.innerHTML = `<option value="">Error</option>`;
      }
    }

    repoSelect.addEventListener("change", onRepoChange);

    runBtn.addEventListener("click", async () => {
      const repo = repoSelect.value;
      const skill = skillSelect.value;
      const versionA = versionASelect.value;
      const versionB = versionBSelect.value;
      const model = modelSelect.value;

      if (!repo || !skill || !versionA || !versionB) {
        statusText.textContent = "Please select all fields";
        statusText.className = "status-text error";
        return;
      }
      if (versionA === versionB) {
        statusText.textContent = "Versions must be different";
        statusText.className = "status-text error";
        return;
      }

      runBtn.disabled = true;
      statusText.textContent = "Running eval... this may take 30-60s";
      statusText.className = "status-text";

      try {
        const result = await fetchJSON("/api/run", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ repo, skill, versionA, versionB, model }),
        });
        statusText.textContent = "Eval complete!";
        loadRuns();
      } catch (e) {
        statusText.textContent = e.message;
        statusText.className = "status-text error";
      } finally {
        runBtn.disabled = false;
      }
    });

    function decisionBadge(decision) {
      const d = (decision || "").toUpperCase();
      if (d === "ALLOW" || d === "YES") return `<span class="badge badge-allow">${d}</span>`;
      if (d === "BLOCK" || d === "NO") return `<span class="badge badge-block">${d}</span>`;
      if (d.includes("REWRITE")) return `<span class="badge badge-rewrite">${d}</span>`;
      if (d.includes("HUMAN")) return `<span class="badge badge-human">${d}</span>`;
      return `<span class="badge">${d}</span>`;
    }

    function voteBadge(vote) {
      const v = (vote || "").toUpperCase();
      if (v === "YES") return `<span class="badge badge-yes">YES</span>`;
      if (v === "NO") return `<span class="badge badge-no">NO</span>`;
      if (v === "REWRITE") return `<span class="badge badge-rewrite">REWRITE</span>`;
      return `<span class="badge">${v}</span>`;
    }

    function colorizeDiff(diff) {
      return diff.split("\n").map(line => {
        if (line.startsWith("+")) return `<span class="diff-add">${esc(line)}</span>`;
        if (line.startsWith("-")) return `<span class="diff-del">${esc(line)}</span>`;
        return `<span class="diff-ctx">${esc(line)}</span>`;
      }).join("\n");
    }

    function esc(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function renderPanel(result, modeLabel, badgeClass) {
      const voteRows = (result.votes || []).map(v => `
        <div class="vote-row">
          <span class="vote-name">${esc(v.agentName)}</span>
          ${voteBadge(v.vote)}
          <span class="vote-risk">risk: ${v.risk.toFixed(2)}</span>
          <span class="vote-reason">${esc(v.reason || "")}</span>
        </div>
      `).join("");

      return `
        <div class="panel">
          <div class="panel-header">
            <span class="badge ${badgeClass}">${modeLabel}</span>
            ${decisionBadge(result.decision)}
          </div>
          <div class="panel-stat">Risk: <span>${result.combinedRisk.toFixed(3)}</span></div>
          <div class="panel-stat">Yes ratio: <span>${result.weightedYesRatio.toFixed(2)}</span></div>
          <div class="panel-stat">Quorum: <span>${result.quorumMet ? "met" : "not met"}</span></div>
          <div class="panel-stat">Duration: <span>${(result.durationMs / 1000).toFixed(1)}s</span></div>
          <div style="margin-top:10px">${voteRows}</div>
        </div>
      `;
    }

    function renderRuns() {
      if (!runs.length) {
        resultsContainer.innerHTML = `
          <div class="empty-state">
            <h3>No results yet</h3>
            <p>Select versions and run an eval to get started.</p>
          </div>`;
        resultCount.textContent = "";
        return;
      }

      resultCount.textContent = `${runs.length} run${runs.length === 1 ? "" : "s"}`;

      resultsContainer.innerHTML = runs.map((run, i) => {
        const s = run.single;
        const c = run.consensus;
        const agree = s.decision === c.decision;

        return `
          <div class="card" data-index="${i}">
            <div class="card-header" onclick="toggleCard(${i})">
              <span class="arrow">&#9654;</span>
              <span class="skill-name">${esc(s.skill)}</span>
              <span class="versions">${esc(s.versionA)} &rarr; ${esc(s.versionB)}</span>
              <span class="model-tag">${esc(s.model)}</span>
              <span class="badge ${agree ? "badge-agree" : "badge-disagree"}">${agree ? "AGREE" : "DISAGREE"}</span>
            </div>
            <div class="card-body">
              <h3 style="margin-bottom:8px">Diff Preview</h3>
              <div class="diff-preview">${colorizeDiff(s.fullDiff || s.diffSummary || "")}</div>
              <div class="panels">
                ${renderPanel(s, "Single", "badge-single")}
                ${renderPanel(c, "Consensus", "badge-consensus")}
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    window.toggleCard = function(i) {
      const card = document.querySelector(`.card[data-index="${i}"]`);
      if (card) card.classList.toggle("open");
    };

    async function loadRuns() {
      try {
        runs = await fetchJSON("/api/runs");
        renderRuns();
      } catch {}
    }

    // Init
    loadRepos();
    loadRuns();
    setInterval(loadRuns, 5000);
  </script>
</body>
</html>
